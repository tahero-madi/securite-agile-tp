# =============================================================================
# Pipeline du projet fil rouge "Demandes internes" - CORRIGE FORMATEUR (fin du TP 3C)
#
# TP 3A : seul le job "tests" est actif. Lancez le pipeline et lisez ce fichier.
# TP 3B : activez les controles de securite en retirant le point (.) devant
#         le nom des jobs (".secrets-gitleaks:" devient "secrets-gitleaks:").
#         Ils sont en mode observation (allow_failure: true) : ils produisent
#         un rapport mais ne bloquent pas.
# TP 3C : passez les controles en mode bloquant (allow_failure: false),
#         constatez l'echec, triez, corrigez, relancez.
#
# Bonne pratique : les images sont epinglees sur une version precise.
# En production, epinglez-les aussi par empreinte (image@sha256:...).
# =============================================================================

stages:
  - tests
  - securite
  - dast

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

default:
  image: python:3.12-slim
  interruptible: true

# --- Tests fonctionnels et tests de securite (pytest) ------------------------
tests:
  stage: tests
  script:
    - pip install -q -r requirements.txt -r requirements-dev.txt
    - mkdir -p rapports
    - python -m pytest -v --junitxml=rapports/junit.xml
  artifacts:
    when: always
    reports:
      junit: rapports/junit.xml

# --- Detection de secrets (Gitleaks) : tout l'historique Git -----------------
secrets-gitleaks:
  stage: securite
  image:
    name: zricethezav/gitleaks:v8.26.0
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"            # historique complet : un secret supprime reste dans l'historique
  script:
    - mkdir -p rapports
    - gitleaks git . --redact --verbose --report-format json --report-path rapports/gitleaks.json
  allow_failure: false         # seuil bloquant
  artifacts:
    when: always
    paths: [rapports/gitleaks.json]

# --- Analyse statique du code (Bandit, specialise Python) --------------------
sast-bandit:
  stage: securite
  script:
    - pip install -q bandit==1.9.4
    - mkdir -p rapports
    - bandit -r . -x ./tests,./.cache -f json -o rapports/bandit.json || true
    # Seuil de blocage : severite ET confiance au moins "medium"
    - bandit -r . -x ./tests,./.cache --severity-level medium --confidence-level medium
  allow_failure: false         # seuil bloquant
  artifacts:
    when: always
    paths: [rapports/bandit.json]

# --- Analyse statique du code (Semgrep, regles maison du dossier .semgrep/) --
sast-semgrep:
  stage: securite
  script:
    - pip install -q semgrep==1.183.0
    - mkdir -p rapports
    # Ajoutez "--config p/python" si le runner a acces a semgrep.dev
    - semgrep scan --config .semgrep/ --metrics=off --disable-version-check --exclude tests --exclude .cache --json --output rapports/semgrep.json || true
    - semgrep scan --config .semgrep/ --metrics=off --disable-version-check --exclude tests --exclude .cache --error
  allow_failure: false         # seuil bloquant
  artifacts:
    when: always
    paths: [rapports/semgrep.json]

# --- Analyse des dependances (pip-audit, base OSV / PyPI) --------------------
sca-pip-audit:
  stage: securite
  script:
    - pip install -q pip-audit==2.10.1
    - mkdir -p rapports
    - pip-audit -r requirements.txt -f json -o rapports/pip-audit.json || true
    - pip-audit -r requirements.txt --desc
  allow_failure: false         # seuil bloquant
  artifacts:
    when: always
    paths: [rapports/pip-audit.json]

# --- Nomenclature logicielle (SBOM CycloneDX) : une preuve, pas un controle --
sbom-cyclonedx:
  stage: securite
  script:
    - pip install -q cyclonedx-bom==7.6.0
    - mkdir -p rapports
    - cyclonedx-py requirements requirements.txt --output-file rapports/sbom.cdx.json
  artifacts:
    paths: [rapports/sbom.cdx.json]
    expire_in: 30 days

# --- Analyse dynamique (OWASP ZAP baseline, scan passif non intrusif) --------
# Lance l'application dans le job puis la scanne en local (127.0.0.1).
# Ne jamais pointer ce job vers une cible non autorisee.
dast-zap:
  stage: dast
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  script:
    - pip3 install -q --user --break-system-packages -r requirements.txt
    - export PATH="$HOME/.local/bin:$PATH"
    - export SECRET_KEY="cle-de-ci-$CI_PIPELINE_ID" COOKIE_SECURE=0
    - flask --app app init-db
    - (flask --app app run --host 127.0.0.1 --port 5000 > flask.log 2>&1 &)
    - sleep 5
    - mkdir -p /zap/wrk rapports
    - zap-baseline.py -t http://127.0.0.1:5000 -r zap.html -J zap.json -I || true
    - cp /zap/wrk/zap.html /zap/wrk/zap.json rapports/
  allow_failure: true
  artifacts:
    when: always
    paths: [rapports/zap.html, rapports/zap.json]

# --- Optionnel : SonarQube (necessite un serveur SonarQube) ------------------
# Variables CI/CD a creer (masquees et protegees) : SONAR_HOST_URL, SONAR_TOKEN
.sast-sonarqube:
  stage: securite
  image:
    name: sonarsource/sonar-scanner-cli:latest   # a epingler sur une version
    entrypoint: [""]
  script:
    - sonar-scanner -Dsonar.projectKey=$CI_PROJECT_PATH_SLUG -Dsonar.sources=. -Dsonar.exclusions=tests/**
  allow_failure: true
